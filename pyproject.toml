[project]
name = "unitshub"
version = "0.4.0"
description = "A unified serving interface for state-of-the-art time-series foundation models."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
  # ---- core numerical stack ----
  "torch>=2.4",          # Timestral requires >=2.4; also compatible with Chronos-2 & TimesFM 3.0
  "numpy>=1.26",
  "scipy>=1.12",
  # ---- HF / transformers ecosystem ----
  "transformers>=4.56",  # TimesFM 3.0 Transformers implementation
  "accelerate>=0.29",
  "huggingface_hub>=0.23",
  # ---- time-series models ----
  "chronos-forecasting>=2.2.0",
  # ---- API serving ----
  "fastapi>=0.110",
  # MCP 1.27 includes the current Streamable HTTP transport and 2025-06-18
  # protocol negotiation. Keep the major-version cap for API stability.
  "mcp>=1.27,<2",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "polars>=1.0.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
# The Timestral runtime is distributed from its official repository, not PyPI.
# Docker/CI install this extra only for MODEL_TYPE=timestral.
timestral = [
  "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---- uv configuration ----
[tool.uv]
managed = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

# ---- lint / format ----
# CI pins the same ruff version through `uvx ruff@<version>`.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection intentionally uses calls in argument defaults.
"app/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
