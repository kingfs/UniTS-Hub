services:
  timesfm:
    image: kingfs/unitshub:timesfm-latest
    restart: always
    profiles:
      - timesfm
    environment:
      MODEL_TYPE: timesfm
      API_KEY: ${API_KEY:-unitshub-secret}
    ports:
      - "8000:8000"

  kronos:
    image: kingfs/unitshub:kronos-latest
    restart: always
    profiles:
      - kronos
    environment:
      MODEL_TYPE: kronos
      API_KEY: ${API_KEY:-unitshub-secret}
    ports:
      - "8000:8000"

  chronos:
    image: kingfs/unitshub:chronos-latest
    restart: always
    profiles:
      - chronos
    environment:
      MODEL_TYPE: chronos
      API_KEY: ${API_KEY:-unitshub-secret}
    ports:
      - "8000:8000"

  timestral:
    image: kingfs/unitshub:timestral-latest
    restart: always
    profiles:
      - timestral
    environment:
      MODEL_TYPE: timestral
      API_KEY: ${API_KEY:-unitshub-secret}
      # Optional: cap the context (most recent steps are kept). Defaults to 32768.
      # TIMESTRAL_MAX_CONTEXT: 2048
    ports:
      - "8000:8000"
